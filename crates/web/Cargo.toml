[package]
name = "w3hk-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The web page: the same screen as the exe, compiled to WASM"

[lib]
crate-type = ["cdylib"]

# Only the wasm build has anything in it, so native builds of the workspace
# don't pull in (or unify features with) the browser crates.
[target.'cfg(target_arch = "wasm32")'.dependencies]
w3hk-casc = { path = "../casc" }
w3hk-core = { path = "../core" }
w3hk-ui = { path = "../ui" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "File",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Location",
    "Storage",
    "Url",
    "Window",
] }
