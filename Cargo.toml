[workspace]
resolver = "3"
members = ["crates/core", "crates/casc", "crates/assets", "crates/ui", "crates/app", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
